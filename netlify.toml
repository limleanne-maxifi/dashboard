[build]
  command   = "npm run build"

[[redirects]]
  from   = "/visibility-engine"
  to     = "/work"
  status = 301
  force  = true

[[redirects]]
  from   = "/work/canso-airspace-world"
  to     = "/work/airspaceworld"
  status = 301
  force  = true
  publish   = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
