[build]
  command        = "npm run build"
  publish        = "dist"
  base           = "."

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/sitemap.xml"
  to     = "/sitemap-index.xml"
  status = 301
  force  = true

[[redirects]]
  from   = "/visibility-engine"
  to     = "/work"
  status = 301
  force  = true

[[redirects]]
  from   = "/work/canso-airspace-world"
  to     = "https://aswhub.maxifidigital.com/"
  status = 301
  force  = true

[[redirects]]
  from   = "/work/airspaceworld"
  to     = "https://aswhub.maxifidigital.com/"
  status = 301
  force  = true

# maxifidigital.com — redirect the retired /asw-hub page to the canonical hub.
# Location: netlify.toml at the ROOT of the maxifidigital.com site repository.
[[redirects]]
  from   = "/asw-hub"
  to     = "https://aswhub.maxifidigital.com/"
  status = 301
  force  = true

[[redirects]]
  from   = "/asw-hub/*"
  to     = "https://aswhub.maxifidigital.com/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
